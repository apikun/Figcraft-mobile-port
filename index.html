  <script>
  /*
   * FigCraft Web — Touch Gesture Adapter (mobile port layer)
   *
   * The engine already listens to native touch events for single-finger
   * input (tap = left click, drag = primary drag). What the web build
   * lacks is multi-finger gestures:
   *   - pinch          -> zoom  (synthesized as ctrl+wheel -> egui zoom_delta)
   *   - two-finger pan -> pan   (synthesized as middle-button drag)
   *
   * Listeners are registered on `window` in the CAPTURE phase so they run
   * before the canvas' own target-phase handlers. During a multi-finger
   * gesture we stopPropagation() to keep raw finger events away from the
   * engine, and synthesize the equivalent mouse/wheel input instead.
   */
  (function () {
    'use strict';

    function boot() {
      var canvas = document.getElementById('figcraft_canvas');
      if (!canvas) return;

      var IDLE = 0, GESTURE = 1, BLOCK = 2; // BLOCK: swallow leftover finger events
      var state = IDLE;
      var fingers = new Map(); // identifier -> {x, y}
      var lastDist = 0, lastMid = null;

      function pt(t) { return { x: t.clientX, y: t.clientY }; }
      function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
      function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

      function pointer(type, x, y, button, buttons) {
        var e;
        try {
          e = new PointerEvent(type, {
            pointerId: 1, pointerType: 'mouse', isPrimary: true,
            clientX: x, clientY: y, button: button, buttons: buttons,
            bubbles: true, cancelable: true, view: window
          });
        } catch (err) {
          e = document.createEvent('MouseEvents');
          e.initMouseEvent(type, true, true, window, 0, x, y, x, y, false, false, false, false, buttons, null);
        }
        canvas.dispatchEvent(e);
      }

      function wheel(x, y, deltaY) {
        var e;
        try {
          e = new WheelEvent('wheel', {
            clientX: x, clientY: y, deltaX: 0, deltaY: deltaY, deltaZ: 0,
            deltaMode: 0, ctrlKey: true, bubbles: true, cancelable: true, view: window
          });
        } catch (err) { return; }
        canvas.dispatchEvent(e);
      }

      function takeOver(t1, t2) {
        state = GESTURE;
        lastDist = dist(t1, t2);
        lastMid = mid(t1, t2);
        // Release the primary drag the first finger may have started.
        pointer('pointerup', t1.x, t1.y, 0, 0);
        // Begin middle-button pan at the gesture midpoint.
        pointer('pointerdown', lastMid.x, lastMid.y, 1, 4);
      }

      function onCapture(e) {
        var i, t;

        if (e.type === 'touchstart') {
          for (i = 0; i < e.changedTouches.length; i++) {
            t = e.changedTouches[i];
            fingers.set(t.identifier, pt(t));
          }
          if (fingers.size === 2 && state === IDLE) {
            e.preventDefault(); e.stopPropagation();
            var arr = Array.from(fingers.values());
            takeOver(arr[0], arr[1]);
          } else if (fingers.size > 1) {
            e.preventDefault(); e.stopPropagation();
          }
          return;
        }

        if (e.type === 'touchmove') {
          if (state === IDLE) return; // single finger: let the engine handle it natively
          e.preventDefault(); e.stopPropagation();
          for (i = 0; i < e.changedTouches.length; i++) {
            t = e.changedTouches[i];
            if (fingers.has(t.identifier)) fingers.set(t.identifier, pt(t));
          }
          if (state === GESTURE && fingers.size >= 2) {
            var arr2 = Array.from(fingers.values());
            var d = dist(arr2[0], arr2[1]);
            var m = mid(arr2[0], arr2[1]);
            // Pinch -> ctrl+wheel (negative deltaY = zoom in).
            if (Math.abs(d - lastDist) > 0.5) {
              wheel(m.x, m.y, -(d - lastDist) * 1.5);
              lastDist = d;
            }
            // Two-finger drag -> continue middle-button pan.
            if (Math.abs(m.x - lastMid.x) + Math.abs(m.y - lastMid.y) > 0) {
              pointer('pointermove', m.x, m.y, 1, 4);
              lastMid = m;
            }
          }
          return;
        }

        // touchend / touchcancel
        var removed = 0;
        for (i = 0; i < e.changedTouches.length; i++) {
          t = e.changedTouches[i];
          if (fingers.delete(t.identifier)) removed++;
        }
        if (state === IDLE) return;

        e.preventDefault(); e.stopPropagation();
        if (fingers.size === 0) {
          if (state === GESTURE) pointer('pointerup', lastMid.x, lastMid.y, 1, 0);
          state = IDLE;
        } else if (fingers.size === 1) {
          // One finger left in the gesture: swallow its events until it lifts
          // (its touchstart was already consumed, so the engine has no
          // pointer-down state for it and must not receive a dangling stream).
          state = BLOCK;
        }
      }

      ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {
        window.addEventListener(type, onCapture, { capture: true, passive: false });
      });

      // Keep double-tap zoom / long-press callout out of the way on the canvas.
      canvas.style.touchAction = 'none';
      canvas.style.webkitUserSelect = 'none';
      canvas.style.webkitTouchCallout = 'none';
      canvas.addEventListener('dblclick', function (e) { e.preventDefault(); });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot, { once: true });
    } else {
      boot();
    }
  })();
  </script>

      html, body { background: #2c2c2c; }
      #figcraft_loading { color: #b8b8b8; }
    }
